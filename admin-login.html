<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Home Service</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles/admin.css" rel="stylesheet">
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="logo_sm.png" alt="Home Service Logo">
      </div>
      
      <h2 class="login-title">Panel de Administración</h2>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
              <i class="bi bi-eye-fill"></i>
            </button>
          </div>
        </div>

        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

        <button type="submit" class="btn btn-login btn-primary w-100 mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
        </button>

        <div class="text-center">
          <a href="index.html" class="text-muted text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>Volver al inicio
          </a>
        </div>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/auth-supabase.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loginForm = document.getElementById('loginForm');
      const errorMessage = document.getElementById('errorMessage');
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');

      // Verificar si ya está autenticado
      if (authSystem.isAuthenticated()) {
        window.location.href = 'admin-panel.html';
        return;
      }

      // Toggle password visibility
      togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        const icon = this.querySelector('i');
        icon.classList.toggle('bi-eye-fill');
        icon.classList.toggle('bi-eye-slash-fill');
      });

      // Handle login
      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Mostrar loading
        const submitBtn = loginForm.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verificando...';
        submitBtn.disabled = true;

        try {
          const result = await authSystem.login(username, password);
          
          if (result.success) {
            errorMessage.classList.add('d-none');
            
            // Mostrar éxito
            submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>¡Acceso concedido!';
            submitBtn.classList.remove('btn-primary');
            submitBtn.classList.add('btn-success');
            
            // Redirigir al panel
            setTimeout(() => {
              window.location.href = 'admin-panel.html';
            }, 500);
          } else {
            errorMessage.textContent = result.message;
            errorMessage.classList.remove('d-none');
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            
            // Shake animation
            loginForm.classList.add('animate__animated', 'animate__headShake');
            setTimeout(() => {
              loginForm.classList.remove('animate__animated', 'animate__headShake');
            }, 1000);
          }
        } catch (error) {
          errorMessage.textContent = 'Error al iniciar sesión. Intenta nuevamente.';
          errorMessage.classList.remove('d-none');
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>

</html>
